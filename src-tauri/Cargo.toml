[package]
name = "league-rank-widget"
version = "1.0.0"
description = "Track League of Legends ranks"
authors = ["Tempest Studios"]
edition = "2021"


[lib]
name = "league_rank_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.9.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "=2.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "league-rank-widget"
path = "src/main.rs"
windows_subsystem = "windows"
