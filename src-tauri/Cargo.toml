[package]
name = "league-rank-widget"
version = "1.0.0"
description = "Track League of Legends ranks"
authors = ["Tempest Studios"]
edition = "2021"


[lib]
name = "league_rank_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "league-rank-widget"
path = "src/main.rs"
windows_subsystem = "windows"
